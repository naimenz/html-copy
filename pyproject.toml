[project]
name = "slack-copy"
version = "0.1.0"
description = ""
authors = [{ name = "Ian McKenzie", email = "ianmck98@gmail.com" }]
requires-python = "~=3.11"
readme = "README.md"
dependencies = [
    "pynput>=1.7.6,<2",
    "pygobject>=3.46.0,<4",
    "pyqt5>=5.15.10,<6",
    "beautifulsoup4>=4.12.3,<5",
    "lxml>=5.1.0,<6",
    "markdown>=3.5.2,<4",
    "pymdown-extensions>=10.7.1,<11",
    "typing-extensions>=4.12.2,<5",
]

[project.scripts]
slack-copy = "slack_copy.main:main"

[dependency-groups]
dev = ["ipykernel>=6.29.0,<7"]

[tool.hatch.build.targets.sdist]
include = ["slack_copy"]

[tool.hatch.build.targets.wheel]
include = ["slack_copy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
